// ✅ PASSWORD MASTER E FUNZIONI DI CRITTOGRAFIA
const PASSWORD_MASTER = "LaTuaPasswordSegreta123";

function crittografa(dati) {
    return CryptoJS.AES.encrypt(JSON.stringify(dati), PASSWORD_MASTER).toString();
}

function decrittografa(stringaCritta) {
    if (!stringaCritta || typeof stringaCritta !== 'string' || stringaCritta.trim() === '') {
        return null;
    }
    try {
        const bytes = CryptoJS.AES.decrypt(stringaCritta, PASSWORD_MASTER);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    } catch {
        console.warn("Dati non validi o corrotti");
        return null;
    }
}

// ✅ GESTIONE LINGUA
function getLingua() { return localStorage.getItem('linguaScelta') || 'it'; }
function setLingua(l) { localStorage.setItem('linguaScelta', l); }

function aggiornaInterfacciaLingua() {
    const l = getLingua();
    const t = traduzioni[l];
    document.documentElement.lang = l;
    document.getElementById('bandieraAttuale').textContent = l === 'it' ? '🇮🇹' : l === 'en' ? '🇬🇧' : l === 'pt' ? '🇧🇷' : '🇪🇸';

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const chiave = el.getAttribute('data-i18n');
        if (t[chiave]) el.textContent = t[chiave];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const chiave = el.getAttribute('data-i18n-placeholder');
        if (t[chiave]) el.placeholder = t[chiave];
    });
}

function toggleMenuLingue() { document.getElementById('menuLingue').classList.toggle('visibile'); }
function cambiaLingua(nuovaLingua) { setLingua(nuovaLingua); aggiornaInterfacciaLingua(); toggleMenuLingue(); disegnaPagina(); }
document.addEventListener('click', e => { if (!e.target.closest('.contenitore-lingua')) document.getElementById('menuLingue').classList.remove('visibile'); });

// ✅ FUNZIONE DI SUPPORTO PER SALVATAGGIO FILE
function salvaFileDatabase(dati, nomeFile) {
    const contenuto = typeof dati === 'string' ? dati : JSON.stringify(dati, null, 2);
    const blob = new Blob([contenuto], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeFile;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ✅ CARICA IMMAGINE PROTETTA
async function caricaImmagineProtetta(percorso, idElemento, datiImmagineBase64 = null) {
    const elemImg = document.getElementById(idElemento);
    if (datiImmagineBase64) {
        elemImg.src = datiImmagineBase64;
        elemImg.style.display = "block";
        return;
    }
    try {
        const risposta = await fetch(percorso);
        if (!risposta.ok) throw new Error("File non trovato");
        const datiCritti = await risposta.text();
        const base64 = decrittografa(datiCritti);
        if (!base64) throw new Error("Decrittografia fallita");
        elemImg.src = base64;
        elemImg.style.display = "block";
    } catch (errore) {
        console.warn("Immagine non disponibile:", errore);
        elemImg.alt = "🔒 Immagine protetta";
        elemImg.style.display = "none";
    }
}

let datiAllenatore = {};
let valoriIniziali = {};
let storicoPartite = [];
let importoTotaleDovuto = 0;
let importoPagato = 0;

function ottieniAnnoStagione(numStagione) {
    const inizio = 2019 + (numStagione - 1);
    return `${inizio}/${String(inizio + 1).slice(-2)}`;
}

window.onload = function() {
    aggiornaInterfacciaLingua();
    const contenuto = document.getElementById('contenuto');
    try {
        const datiCritti = localStorage.getItem('allenatoreIngaggiato');
        datiAllenatore = decrittografa(datiCritti);
        if (!datiAllenatore) throw "Nessun dato";

        if (!datiAllenatore._inizialiSalvati) {
            valoriIniziali.ambiente = Number(datiAllenatore.ambiente) || 5;
            valoriIniziali.dirigenza = Number(datiAllenatore.dirigenza) || 5;
            valoriIniziali.progetto = Number(datiAllenatore.progetto) || 5;
            datiAllenatore._inizialiSalvati = true;
            datiAllenatore._valoriIniziali = valoriIniziali;
            salvaDati();
        } else {
            valoriIniziali = datiAllenatore._valoriIniziali;
        }

        const storicoCritt = localStorage.getItem('storicoPartite');
        storicoPartite = storicoCritt ? decrittografa(storicoCritt) : [];
        disegnaPagina();
    } catch (e) {
        const t = traduzioni[getLingua()];
        contenuto.innerHTML = `<div class="vuoto"><h3>${t.nessunDati}</h3><button class="btn-blu" onclick="window.location.href='trattative.html'">${t.vaiTrattative}</button></div>`;
    }
};

function disegnaPagina() {

    const datiSquadraCritti = localStorage.getItem('datiSquadra');

    const nomeBase = datiAllenatore.nome.replace(/\s/g,'_');
    const percorsoFoto = `_immagini_protette/${datiAllenatore.nomeFileFoto || nomeBase}.dat`;
    const percorsoTattica = `_immagini_protette/${datiAllenatore.nomeFileTattica || nomeBase}_tattica.dat`;
    const idFoto = `foto_contratto_ing`;
    const idTattica = `foto_tattica_ing`;

    contenuto.innerHTML = `
    <div class="card">

        ${inContestazione ? `<div class="avvertenza">${t.avvertimento}</div>` : ''}

        <div class="sezione-parametri">
            <h3>${t.parametriTitolo}</h3>
            <div class="riga"><span class="etichetta">${t.ranking}:</span> <span class="valore">${datiAllenatore.ranking || '-'}</span></div>
            <div class="riga"><span class="etichetta">${t.forzaMinima}:</span> <span class="valore">${datiAllenatore.forzaMinima || '-'}</span></div>
            <div class="riga"><span class="etichetta">${t.filosofia}:</span> <span class="valore">${datiAllenatore.filosofia || '-'}</span></div>
            <div class="riga"><span class="etichetta">${t.ambiente}:</span> <span class="valore">${datiAllenatore.ambiente.toFixed(1)}</span></div>
            <div class="riga"><span class="etichetta">${t.dirigenza}:</span> <span class="valore">${datiAllenatore.dirigenza.toFixed(1)}</span></div>
            <div class="riga"><span class="etichetta">${t.progetto}:</span> <span class="valore">${datiAllenatore.progetto.toFixed(1)}</span></div>
            <div class="riga"><span class="etichetta">${t.bonus}:</span> € ${Number(datiAllenatore.bonus).toLocaleString('it-IT')}</div>
            <div class="riga"><span class="etichetta">${t.ingaggio}:</span> € ${Number(datiAllenatore.ingaggio).toLocaleString('it-IT')}</div>
        </div>

            <button class="btn-giallo" onclick="applicaRisultato('pareggio')">${t.pareggio}</button>
            <button class="btn-rosso" onclick="applicaRisultato('sconfitta')">${t.sconfitta}</button>
            <button class="btn-verde" onclick="applicaRisultato('vittoria_derby')">${t.vittoriaDerby}</button>
            <button class="btn-giallo" onclick="applicaRisultato('pareggio_derby')">${t.pareggioDerby}</button>
            <button class="btn-rosso" onclick="applicaRisultato('sconfitta_derby')">${t.sconfittaDerby}</button>
        </div>

        <h3 class="titolo-sezione">${t.eventiTitolo}</h3>
        <div class="griglia-eventi">
            <button class="btn-blu" onclick="applicaEvento('pn_turno')">${t.pnTurno}</button>
            <button class="btn-verde" onclick="applicaEvento('pn_vittoria')">${t.pnVittoria}</button>
            <button class="btn-rosso" onclick="applicaEvento('pn_eliminato')">${t.pnEliminato}</button>
            <button class="btn-turchese" onclick="applicaEvento('pi_turno')">${t.piTurno}</button>
            <button class="btn-verde" onclick="applicaEvento('pi_vittoria')">${t.piVittoria}</button>
            <button class="btn-rosso" onclick="applicaEvento('pi_eliminato')">${t.piEliminato}</button>

        </div>

        <h3 class="titolo-sezione">${t.documentazione}</h3>
        <h4>${t.fotoContratto}</h4>
        <img id="${idFoto}" class="foto" style="display:none;">

    if (datiAllenatore.foto) caricaImmagineProtetta(percorsoFoto, idFoto, datiAllenatore.foto);
    if (datiAllenatore.fotoTattica) caricaImmagineProtetta(percorsoTattica, idTattica, datiAllenatore.fotoTattica);
}

function applicaRisultato(tipo) {
    const t = traduzioni[getLingua()];
    const inContestazione = datiAllenatore.ambiente <= 0;
    const regoleNormali = {
        'vittoria': { ambiente: +1, dirigenza: +1, progetto: +0.5, nome: t.vittoria },
        'pareggio': { ambiente: 0, dirigenza: 0, progetto: +0.5, nome: t.pareggio },
        'sconfitta': { ambiente: -1, dirigenza: -1, progetto: -1, nome: t.sconfitta },
        'vittoria_derby': { ambiente: +2, dirigenza: +1.5, progetto: +0.5, nome: t.vittoriaDerby },
        'pareggio_derby': { ambiente: +1, dirigenza: +1, progetto: +0.5, nome: t.pareggioDerby },
        'sconfitta_derby': { ambiente: -2, dirigenza: -1.5, progetto: -1, nome: t.sconfittaDerby }
    };
    const regoleContestazione = {
        'vittoria': { ambiente: +1, dirigenza: +1, progetto: +0.5, nome: `${t.vittoria} (OK)` },
        'pareggio': { ambiente: 0, dirigenza: -1.5, progetto: +0.5, nome: `${t.pareggio} (!)` },
        'sconfitta': { ambiente: 0, dirigenza: -3, progetto: -1.5, nome: `${t.sconfitta} (!)` },
        'vittoria_derby': { ambiente: +1.5, dirigenza: +2, progetto: +0.5, nome: `${t.vittoriaDerby} (OK)` },
        'pareggio_derby': { ambiente: 0, dirigenza: -1, progetto: -1, nome: `${t.pareggioDerby} (!)` },
        'sconfitta_derby': { ambiente: 0, dirigenza: -2, progetto: -1.5, nome: `${t.sconfittaDerby} (!)` }
    };
    const regole = inContestazione ? regoleContestazione : regoleNormali;
    const r = regole[tipo];
    datiAllenatore.ambiente = limitaValore(datiAllenatore.ambiente + r.ambiente);
    datiAllenatore.dirigenza = limitaValore(datiAllenatore.dirigenza + r.dirigenza);
    datiAllenatore.progetto = limitaValore(datiAllenatore.progetto + r.progetto);
    aggiungiStorico(r.nome); salvaDati(); disegnaPagina(); controllaDirigenzaZero();
}

function applicaEvento(tipo) {
    const t = traduzioni[getLingua()];
    const eventi = {
        'pn_turno':      { ambiente: +1,  dirigenza: +1,   progetto: +0.5, nome: t.pnTurno },
        'pn_vittoria':   { ambiente: +2,  dirigenza: +2,   progetto: +1,   nome: t.pnVittoria },
        'pn_eliminato':  { ambiente: -1,  dirigenza: -1,   progetto: -1,   nome: t.pnEliminato },
        'pi_turno':      { ambiente: +2,  dirigenza: +1.5, progetto: +1,   nome: t.piTurno },
        'pi_vittoria':   { ambiente: +10, dirigenza: +10,  progetto: +10,  nome: t.piVittoria },
        'pi_eliminato':  { ambiente: -2,  dirigenza: -1.5, progetto: -1,   nome: t.piEliminato },
        'campionato':    { ambiente: +5,  dirigenza: +5,   progetto: +5,   nome: t.campionato },
        'obiettivo_si':  { ambiente: +3,  dirigenza: +3,   progetto: +1.5, nome: t.obiettivoSi },
        'obiettivo_no':  { ambiente: -3,  dirigenza: -3,   progetto: -1.5, nome: t.obiettivoNo }
    };
    const ev = eventi[tipo];
    datiAllenatore.ambiente = limitaValore(datiAllenatore.ambiente + ev.ambiente);
    datiAllenatore.dirigenza = limitaValore(datiAllenatore.dirigenza + ev.dirigenza);
    datiAllenatore.progetto = limitaValore(datiAllenatore.progetto + ev.progetto);
    aggiungiStorico(ev.nome); salvaDati(); disegnaPagina(); controllaDirigenzaZero();
}

function limitaValore(val) { return Math.max(0, Math.min(10, Math.round(val * 10) / 10)); }
function aggiungiStorico(testo) { storicoPartite.unshift({ risultato: testo, data: new Date().toLocaleString('it-IT') }); }

function azzeraStoricoERipristina() {
    const t = traduzioni[getLingua()];
    if (confirm(t.confermaReset)) {
        storicoPartite = [];
        datiAllenatore.ambiente = valoriIniziali.ambiente;
        datiAllenatore.dirigenza = valoriIniziali.dirigenza;
        datiAllenatore.progetto = valoriIniziali.progetto;
        salvaDati(); disegnaPagina();
    }
}

function gestisciFineStagione() {
    const t = traduzioni[getLingua()];
    const datiSquadraCritti = localStorage.getItem('datiSquadra');
    const datiSquadra = datiSquadraCritti ? decrittografa(datiSquadraCritti) : {};
    const stagionePrecedente = datiSquadra.stagione || 1;
    const numStagione = stagionePrecedente;
    const esonerato = datiAllenatore._esonerato === true;

    let obiettivo = 'Nessun dato';
    if (storicoPartite.some(p => p.risultato === t.obiettivoSi)) obiettivo = 'Raggiunto';
    else if (storicoPartite.some(p => p.risultato === t.obiettivoNo)) obiettivo = 'Non Raggiunto';

    const recordStagionale = {
        numStagione, anno: ottieniAnnoStagione(numStagione), nomeAllenatore: datiAllenatore.nome, esonerato,
        iniziali: {...valoriIniziali}, finali: {ambiente: datiAllenatore.ambiente, dirigenza: datiAllenatore.dirigenza, progetto: datiAllenatore.progetto},
        campionato: !!storicoPartite.find(p => p.risultato.includes(t.campionato)),
        coppeNazionali: storicoPartite.filter(p => p.risultato.includes('Coppa') && p.risultato.includes('Vittoria') && !p.risultato.includes('Internazionale')).length,
        coppeInternazionali: storicoPartite.filter(p => p.risultato.includes('Internazionale') && p.risultato.includes('Vittoria')).length,
        obiettivo
    };

    const storicoCritt = localStorage.getItem('storicoCarriera');
    let storico = storicoCritt ? decrittografa(storicoCritt) : [];
    storico = storico.filter(r => !(r.numStagione === numStagione && r.nomeAllenatore === datiAllenatore.nome));
    storico.push(recordStagionale);
    localStorage.setItem('storicoCarriera', crittografa(storico));

    datiSquadra.stagione = stagionePrecedente + 1;
    localStorage.setItem('datiSquadra', crittografa(datiSquadra));

    const scelta = confirm(t.stagioneConclusa);
    if (scelta) {
        storicoPartite = [];
        valoriIniziali.ambiente = datiAllenatore.ambiente;
        valoriIniziali.dirigenza = datiAllenatore.dirigenza;
        valoriIniziali.progetto = datiAllenatore.progetto;
        datiAllenatore._valoriIniziali = valoriIniziali;
        salvaDati(); disegnaPagina();
        alert(t.stagioneSalvata.replace('{num}', numStagione).replace('{nuova}', datiSquadra.stagione));
    } else {
        datiAllenatore._esonerato = true; salvaDati(); apriModalePagamento();
    }
}

function controllaDirigenzaZero() { if (Number(datiAllenatore.dirigenza) <= 0) apriModalePagamento(); }
function apriModalePagamento() { importoTotaleDovuto = Number(datiAllenatore.ingaggio) || 0; importoPagato = 0; document.getElementById('importoIngaggio').textContent = importoTotaleDovuto.toLocaleString('it-IT'); document.getElementById('totaleDovuto').textContent = importoTotaleDovuto.toLocaleString('it-IT'); aggiornaPagamentoUI(); document.getElementById('modaleEsonero').classList.remove('nascosto'); }
function aggiungiPagamento() { const val = Number(document.getElementById('offertaPagamento').value) || 0; importoPagato += val; if (importoPagato > importoTotaleDovuto) importoPagato = importoTotaleDovuto; aggiornaPagamentoUI(); document.getElementById('offertaPagamento').value = ''; }
function aggiornaPagamentoUI() { document.getElementById('totalePagato').textContent = importoPagato.toLocaleString('it-IT'); document.getElementById('btnConfermaPagamento').disabled = (importoPagato < importoTotaleDovuto); }
function salvaDati() { localStorage.setItem('allenatoreIngaggiato', crittografa(datiAllenatore)); localStorage.setItem('storicoPartite', crittografa(storicoPartite)); }

function confermaPagamento() {
    localStorage.removeItem('allenatoreIngaggiato'); localStorage.removeItem('storicoPartite');
    try {
        const datiSquadraCritti = localStorage.getItem('datiSquadra');
        const datiSquadra = datiSquadraCritti ? decrittografa(datiSquadraCritti) : {};
        const numStagione = datiSquadra.stagione || 1;
        let obiettivo = 'Nessun dato';
        const t = traduzioni[getLingua()];
        if (storicoPartite.some(p => p.risultato === t.obiettivoSi)) obiettivo = 'Raggiunto';
        else if (storicoPartite.some(p => p.risultato === t.obiettivoNo)) obiettivo = 'Non Raggiunto';

        const recordStagionale = {
            numStagione, anno: ottieniAnnoStagione(numStagione), nomeAllenatore: datiAllenatore.nome || 'Sconosciuto', esonerato: true,
            iniziali: valoriIniziali, finali: {ambiente: datiAllenatore.ambiente ?? 0, dirigenza: datiAllenatore.dirigenza ?? 0, progetto: datiAllenatore.progetto ?? 0},
