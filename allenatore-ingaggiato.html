// ✅ PASSWORD MASTER E FUNZIONI DI CRITTOGRAFIA SICURE
const PASSWORD_MASTER = "LaTuaPasswordSegreta123";

function crittografa(dati) {
    return CryptoJS.AES.encrypt(JSON.stringify(dati), PASSWORD_MASTER).toString();
}

function decrittografa(stringaCritta) {
    if (!stringaCritta || typeof stringaCritta !== 'string' || stringaCritta.trim() === '') return null;
    try {
        const bytes = CryptoJS.AES.decrypt(stringaCritta, PASSWORD_MASTER);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    } catch { return null; }
}

// ✅ GESTIONE LINGUA
function getLingua() { return localStorage.getItem('linguaScelta') || 'it'; }
function setLingua(l) { localStorage.setItem('linguaScelta', l); }
function aggiornaInterfacciaLingua() {
    const l = getLingua(), t = traduzioni[l];
    document.documentElement.lang = l;
    document.getElementById('bandieraAttuale').textContent = {it:'🇮🇹',en:'🇬🇧',pt:'🇧🇷',es:'🇪🇸'}[l];
    document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k])el.textContent=t[k];});
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const k=el.getAttribute('data-i18n-placeholder');if(t[k])el.placeholder=t[k];});
}
function toggleMenuLingue(){document.getElementById('menuLingue').classList.toggle('visibile');}
function cambiaLingua(l){setLingua(l);aggiornaInterfacciaLingua();toggleMenuLingue();disegnaPagina();}
document.addEventListener('click',e=>{if(!e.target.closest('.contenitore-lingua'))document.getElementById('menuLingue').classList.remove('visibile');});

// ✅ VARIABILI GLOBALI
let datiAllenatore = {}, valoriIniziali = {}, storicoPartite = [], importoTotaleDovuto=0, importoPagato=0;

function ottieniAnnoStagione(n){const i=2019+(n-1);return `${i}/${String(i+1).slice(-2)}`;}

// ✅ CARICAMENTO IMMAGINE SEMPLICE E PROTETTO
function caricaImmagine(id, src){const img=document.getElementById(id);if(img&&src){img.onload=()=>{};img.onerror=()=>{img.style.display='none';};img.src=src;img.style.display='block';}}

window.onload = function(){
    aggiornaInterfacciaLingua();
    const contenuto = document.getElementById('contenuto');
    try {
        const datiCritti = localStorage.getItem('allenatoreIngaggiato');
        datiAllenatore = decrittografa(datiCritti);
        if (!datiAllenatore) throw 'vuoto';

        // Salva valori iniziali se nuovi
        if (!datiAllenatore._iniziali) {
            valoriIniziali = {ambiente:Number(datiAllenatore.ambiente||5),dirigenza:Number(datiAllenatore.dirigenza||5),progetto:Number(datiAllenatore.progetto||5)};
            datiAllenatore._iniziali = true;
            datiAllenatore._valoriIniziali = valoriIniziali;
            salvaDati();
        } else valoriIniziali = datiAllenatore._valoriIniziali;

        // Storico
        const stCritt = localStorage.getItem('storicoPartite');
        storicoPartite = stCritt ? decrittografa(stCritt) : [];
        disegnaPagina();
    } catch(e) {
        const t = traduzioni[getLingua()];
        contenuto.innerHTML = `<div class="vuoto"><h3>${t.nessunDati}</h3><button class="btn-blu" onclick="window.location.href='trattative.html'">${t.vaiTrattative}</button></div>`;
    }
};

            <div class="riga"><span class="etichetta">${t.dirigenza}:</span> <span class="valore">${Number(datiAllenatore.dirigenza).toFixed(1)}</span></div>

            <button class="btn-rosso" onclick="applicaRisultato('sconfitta_derby')">${t.sconfittaDerby}</button>
        </div>

        <h3 class="titolo-sezione">${t.eventiTitolo}</h3>
        <div class="griglia-eventi">
            <button class="btn-blu" onclick="applicaEvento('pn_turno')">${t.pnTurno}</button>
            <button class="btn-verde" onclick="applicaEvento('pn_vittoria')">${t.pnVittoria}</button>
            <button class="btn-rosso" onclick="applicaEvento('pn_eliminato')">${t.pnEliminato}</button>
            <button class="btn-turchese" onclick="applicaEvento('pi_turno')">${t.piTurno}</button>
            <button class="btn-verde" onclick="applicaEvento('pi_vittoria')">${t.piVittoria}</button>
            <button class="btn-rosso" onclick="applicaEvento('pi_eliminato')">${t.piEliminato}</button>
            <button class="btn-viola" onclick="applicaEvento('campionato')">${t.campionato}</button>
            <button class="btn-verde" onclick="applicaEvento('obiettivo_si')">${t.obiettivoSi}</button>
            <button class="btn-rosso" onclick="applicaEvento('obiettivo_no')">${t.obiettivoNo}</button>
        </div>

        <div class="storico">
            <h3>${t.storicoTitolo} (${storicoPartite.length})</h3>
            ${storicoPartite.length === 0 ? `<p style="color:#777">${t.nessunEvento}</p>` : storicoPartite.map(p=>`<div class="riga-partita">${p.data} - ${p.testo}</div>`).join('')}
        </div>
    </div>`;

    // ✅ CARICA IMMAGINI DOPO CREAZIONE HTML
    if (datiAllenatore.foto) caricaImmagine('imgContratto', datiAllenatore.foto);
    if (datiAllenatore.fotoTattica) caricaImmagine('imgTattica', datiAllenatore.fotoTattica);
}

// ✅ REGOLE RISULTATI ORIGINALI
function applicaRisultato(tipo){
    const t = traduzioni[getLingua()];
    const regoleNormali = {
        vittoria: {a:+1,d:+1,p:+0.5,t:t.vittoria},
        pareggio: {a:0,d:0,p:+0.5,t:t.pareggio},
        sconfitta: {a:-1,d:-1,p:-1,t:t.sconfitta},
        vittoria_derby: {a:+2,d:+1.5,p:+0.5,t:t.vittoriaDerby},
        pareggio_derby: {a:+1,d:+1,p:+0.5,t:t.pareggioDerby},
        sconfitta_derby: {a:-2,d:-1.5,p:-1,t:t.sconfittaDerby}
    };
    const regoleCritiche = {
        vittoria: {a:+1,d:+1,p:+0.5,t:t.vittoria},
        pareggio: {a:0,d:-1.5,p:+0.5,t:t.pareggio},
        sconfitta: {a:0,d:-3,p:-1.5,t:t.sconfitta},
        vittoria_derby: {a:+1.5,d:+2,p:+0.5,t:t.vittoriaDerby},
        pareggio_derby: {a:0,d:-1,p:-1,t:t.pareggioDerby},
        sconfitta_derby: {a:0,d:-2,p:-1.5,t:t.sconfittaDerby}
    };
    const regole = datiAllenatore.ambiente <= 0 ? regoleCritiche : regoleNormali;
    const r = regole[tipo];
    datiAllenatore.ambiente = limita(datiAllenatore.ambiente + r.a);
    datiAllenatore.dirigenza = limita(datiAllenatore.dirigenza + r.d);
    datiAllenatore.progetto = limita(datiAllenatore.progetto + r.p);
    aggiungiStorico(r.t); salvaDati(); disegnaPagina(); controllaEsito();
}

// ✅ EVENTI SPECIALI
function applicaEvento(tipo){
    const t = traduzioni[getLingua()];
    const ev = {
        pn_turno: {a:+1,d:+1,p:+0.5,t:t.pnTurno},
        pn_vittoria: {a:+2,d:+2,p:+1,t:t.pnVittoria},
        pn_eliminato: {a:-1,d:-1,p:-1,t:t.pnEliminato},
        pi_turno: {a:+2,d:+1.5,p:+1,t:t.piTurno},
        pi_vittoria: {a:+10,d:+10,p:+10,t:t.piVittoria},
        pi_eliminato: {a:-2,d:-1.5,p:-1,t:t.piEliminato},
        campionato: {a:+5,d:+5,p:+5,t:t.campionato},
        obiettivo_si: {a:+3,d:+3,p:+1.5,t:t.obiettivoSi},
        obiettivo_no: {a:-3,d:-3,p:-1.5,t:t.obiettivoNo}
    }[tipo];
    datiAllenatore.ambiente = limita(datiAllenatore.ambiente + ev.a);
    datiAllenatore.dirigenza = limita(datiAllenatore.dirigenza + ev.d);
    datiAllenatore.progetto = limita(datiAllenatore.progetto + ev.p);
    aggiungiStorico(ev.t); salvaDati(); disegnaPagina(); controllaEsito();
}

function limita(v){return Math.max(0,Math.min(10,Math.round(v*10)/10));}
function aggiungiStorico(testo){storicoPartite.unshift({testo, data:new Date().toLocaleString('it-IT')});}
function salvaDati(){localStorage.setItem('allenatoreIngaggiato',crittografa(datiAllenatore));localStorage.setItem('storicoPartite',crittografa(storicoPartite));}
function controllaEsito(){if(datiAllenatore.dirigenza<=0)apriModalePagamento();}

function azzeraStoricoERipristina(){
    const t=traduzioni[getLingua()];
    if(confirm(t.confermaReset)){storicoPartite=[];datiAllenatore.ambiente=valoriIniziali.ambiente;datiAllenatore.dirigenza=valoriIniziali.dirigenza;datiAllenatore.progetto=valoriIniziali.progetto;salvaDati();disegnaPagina();}
}

function gestisciFineStagione(){
    const t=traduzioni[getLingua()];
    const datiSquadra = localStorage.getItem('datiSquadra') ? decrittografa(localStorage.getItem('datiSquadra')) : {};
    const stagione = datiSquadra.stagione || 1;

    // Salva storico carriera
    const record = {
        stagione, anno:ottieniAnnoStagione(stagione), nome:datiAllenatore.nome,
        iniziali:{...valoriIniziali}, finali:{a:datiAllenatore.ambiente,d:datiAllenatore.dirigenza,p:datiAllenatore.progetto},
        campionato:storicoPartite.some(x=>x.testo.includes(t.campionato))
    };
    const carriera = localStorage.getItem('storicoCarriera') ? decrittografa(localStorage.getItem('storicoCarriera')) : [];
    carriera.push(record); localStorage.setItem('storicoCarriera',crittografa(carriera));

    datiSquadra.stagione = stagione + 1; localStorage.setItem('datiSquadra',crittografa(datiSquadra));

    if(confirm(t.stagioneConclusa)){
        storicoPartite=[]; valoriIniziali={ambiente:datiAllenatore.ambiente,dirigenza:datiAllenatore.dirigenza,progetto:datiAllenatore.progetto};
        datiAllenatore._valoriIniziali=valoriIniziali; salvaDati(); disegnaPagina(); alert(t.stagioneSalvata);
    } else { datiAllenatore._esonerato=true; salvaDati(); apriModalePagamento(); }
}

// ✅ MODALE PAGAMENTO
function apriModalePagamento(){
    importoTotaleDovuto = Number(datiAllenatore.ingaggio)||0; importoPagato=0;
    document.getElementById('importoIngaggio').textContent=importoTotaleDovuto.toLocaleString('it-IT');
    document.getElementById('totaleDovuto').textContent=importoTotaleDovuto.toLocaleString('it-IT');
    aggiornaPagamentoUI(); document.getElementById('modaleEsonero').classList.remove('nascosto');
}
function aggiungiPagamento(){const v=Number(document.getElementById('offertaPagamento').value)||0; importoPagato=Math.min(importoPagato+v,importoTotaleDovuto); aggiornaPagamentoUI(); document.getElementById('offertaPagamento').value='';}
function aggiornaPagamentoUI(){document.getElementById('totalePagato').textContent=importoPagato.toLocaleString('it-IT'); document.getElementById('btnConfermaPagamento').disabled=(importoPagato<importoTotaleDovuto);}
function confermaPagamento(){
    localStorage.removeItem('allenatoreIngaggiato'); localStorage.removeItem('storicoPartite');
    window.location.href='trattative.html';
}
</script>
