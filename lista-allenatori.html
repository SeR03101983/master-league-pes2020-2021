// ✅ PASSWORD MASTER
const PASSWORD_MASTER = "LaTuaPasswordSegreta123";

function crittografa(dati) {
    return CryptoJS.AES.encrypt(JSON.stringify(dati), PASSWORD_MASTER).toString();
}

function decrittografa(stringaCritta) {
    if (!stringaCritta || typeof stringaCritta !== 'string' || stringaCritta.trim() === '') return null;
    try {
        const bytes = CryptoJS.AES.decrypt(stringaCritta, PASSWORD_MASTER);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    } catch {
        console.warn("Dati non validi o corrotti");
        return null;
    }
}

// ✅ GESTIONE LINGUA
function getLingua() { return localStorage.getItem('linguaScelta') || 'it'; }
function setLingua(l) { localStorage.setItem('linguaScelta', l); }

function aggiornaInterfacciaLingua() {
    const l = getLingua();
    const t = traduzioni[l];
    document.documentElement.lang = l;
    document.getElementById('bandieraAttuale').textContent = l === 'it' ? '🇮🇹' : l === 'en' ? '🇬🇧' : l === 'pt' ? '🇧🇷' : '🇪🇸';

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const chiave = el.getAttribute('data-i18n');
        if (t[chiave]) el.textContent = t[chiave];
    });
}

function toggleMenuLingue() { document.getElementById('menuLingue').classList.toggle('visibile'); }

function cambiaLingua(nuovaLingua) {
    setLingua(nuovaLingua);
    aggiornaInterfacciaLingua();
    toggleMenuLingue();
    mostraElenco(datiListaCorrente || []); // Aggiorna lista se visibile
}

// ✅ CHIUDE MENU CLICCANDO FUORI
document.addEventListener('click', e => {
    if (!e.target.closest('.contenitore-lingua')) document.getElementById('menuLingue').classList.remove('visibile');
});

// ✅ SALVA SBLOCCHI
function salvaStatoSblocco(indice, sbloccato) {
    let stati = JSON.parse(localStorage.getItem('statiSbloccoPermanenti') || '{}');
    stati[indice] = sbloccato;
    localStorage.setItem('statiSbloccoPermanenti', JSON.stringify(stati));
}

// ✅ CARICAMENTO IMMAGINE
async function caricaImmagineProtetta(percorso, idElemento, datiImmagineBase64 = null) {
    const elemImg = document.getElementById(idElemento);
    if (datiImmagineBase64) {
        elemImg.src = datiImmagineBase64;
        elemImg.style.display = "block";
        return;
    }
    try {
        const risposta = await fetch(percorso);
        if (!risposta.ok) throw new Error("File non trovato");
        const datiCritti = await risposta.text();
        const base64 = decrittografa(datiCritti);
        if (!base64) throw new Error("Decrittografia fallita");
        elemImg.src = base64;
        elemImg.style.display = "block";
    } catch (errore) {
        console.warn("Immagine non disponibile:", errore);
        elemImg.alt = "🔒 Immagine protetta";
    }
}

let datiListaCorrente = []; // Salva lista per aggiornamento lingua

// ✅ CARICA LISTA
function caricaLista(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const listaDalFile = decrittografa(e.target.result);
        const t = traduzioni[getLingua()];
        if (!listaDalFile) { alert(t.fileNonValido); return; }

        const mieiSblocchi = JSON.parse(localStorage.getItem('statiSbloccoPermanenti') || '{}');
        listaDalFile.forEach((a,i) => { if (mieiSblocchi[i] === true) a.sbloccato = true; });

        localStorage.setItem('elencoCompletoAllenatori', crittografa(listaDalFile));
        localStorage.setItem('listaLavoro', crittografa(listaDalFile));
        datiListaCorrente = listaDalFile;
        document.getElementById('statoPagina').textContent = t.listaCaricata + listaDalFile.length + t.elementi;
        mostraElenco(listaDalFile);
    };
    reader.readAsText(file);
}

// ✅ MOSTRA ELENCO
function mostraElenco(lista) {
    const contenitore = document.getElementById('elencoAllenatori');
    const messaggioVuoto = document.getElementById('vuoto');
    contenitore.innerHTML = '';
    datiListaCorrente = lista;
    const t = traduzioni[getLingua()];

    if (!lista || lista.length === 0) { messaggioVuoto.classList.remove('nascosto'); return; }
    messaggioVuoto.classList.add('nascosto');

    lista.forEach((allenatore, indice) => {
        const card = document.createElement('div');
        card.className = 'card-allenatore';
        let classeStato = 'stato-disponibile', testoStato = t.disponibile;
        if (allenatore.statoTrattativa === 'bloccato') { classeStato = 'stato-bloccato'; testoStato = t.bloccato; }
        else if (allenatore.statoTrattativa === 'trattativa') { classeStato = 'stato-trattativa'; testoStato = t.inTrattativa; }

        const isBloccato = allenatore.protetto && !allenatore.sbloccato;
        let badgeProtezione = isBloccato ? `<span class="badge-protezione stato stato-bloccato">🔒 ${t.bloccato}</span>` : 
                              allenatore.protetto ? `<span class="badge-protezione stato stato-disponibile">✅ ${t.disponibile}</span>` : '';
        const classeImmagine = isBloccato ? 'foto-contratto foto-offuscata' : 'foto-contratto';
        const classeDati = isBloccato ? 'dati-nascosti' : '';
        const idImg = `foto_${indice}_${allenatore.nome.replace(/\s/g,'_')}`;
        const percorsoImmagine = `_immagini_protette/${(allenatore.nomeFileFoto || allenatore.nome.replace(/\s/g,'_'))}.dat`;

        card.innerHTML = `
            <h3>${allenatore.nome || t.senzaNome} ${badgeProtezione}</h3>
            <p><strong>${t.filosofia}:</strong> ${allenatore.filosofia || '-'}</p>
            <div class="${classeDati}">
                <p><strong>${t.ranking}:</strong> ${allenatore.ranking || '-'}</p>
                <p><strong>${t.forzaMinima}:</strong> ${allenatore.forzaMinima || 3}</p>
                <p><strong>${t.ambiente}:</strong> ${allenatore.ambiente || 5} | <strong>${t.dirigenza}:</strong> ${allenatore.dirigenza || 5} | <strong>${t.progetto}:</strong> ${allenatore.progetto || 5}</p>
                <p><strong>${t.bonus}:</strong> €${allenatore.bonus || 0} | <strong>${t.ingaggio}:</strong> €${allenatore.ingaggio || 0}</p>
            </div>
            <img id="${idImg}" class="${classeImmagine}" alt="Contratto" style="display:none;">
            <div class="info-tattica ${classeDati}">${t.tattica}</div>
            <span class="stato ${classeStato}">${testoStato}</span><br><br>
            <button id="btnSblocca_${indice}" onclick="sbloccaAllenatore(${indice})" style="margin-right: 8px;" ${!isBloccato ? 'disabled' : ''}>🔓 ${t.sblocca}</button>
            <button class="btn-rosso" onclick="eliminaElemento('${allenatore.nome}')">🗑️ ${t.elimina}</button>
        `;
        contenitore.appendChild(card);
        if (allenatore.foto) caricaImmagineProtetta(percorsoImmagine, idImg, allenatore.foto);
    });
}

// ✅ SBLOCCO
function sbloccaAllenatore(indice) {
    const listaCritta = localStorage.getItem('listaLavoro') || localStorage.getItem('elencoCompletoAllenatori');
    const lista = decrittografa(listaCritta) || [];
    const allenatore = lista[indice];
    const t = traduzioni[getLingua()];

    const pw = prompt(`🔒 ${t.pwTitolo}\n${t.pwMessaggio}`);
    if (pw === null) return;

    if (btoa(pw.trim()) === allenatore.passwordHash) {
        allenatore.sbloccato = true;
        salvaStatoSblocco(indice, true);
        localStorage.setItem('listaLavoro', crittografa(lista));
        localStorage.setItem('elencoCompletoAllenatori', crittografa(lista));
        alert(t.pwSuccesso);
        mostraElenco(lista);
    } else {
        alert(t.pwErrore);
    }
}

// ✅ ELIMINA LISTA COMPLETA
function eliminaListaCompleta() {
    const t = traduzioni[getLingua()];
    if (!confirm(t.confermaEliminaLista)) return;
    localStorage.removeItem('listaLavoro');
    localStorage.removeItem('elencoCompletoAllenatori');
    localStorage.removeItem('statiSbloccoPermanenti');
    document.getElementById('elencoAllenatori').innerHTML = '';
    document.getElementById('statoPagina').textContent = t.listaEliminata;
    document.getElementById('vuoto').classList.remove('nascosto');
}

// ✅ ELIMINA SINGOLO
function eliminaElemento(nome) {
    const t = traduzioni[getLingua()];
    if (!confirm(t.confermaElimina + nome + '?')) return;
    let lista = decrittografa(localStorage.getItem('listaLavoro')) || [];
    lista = lista.filter(a => a.nome !== nome);
    localStorage.setItem('listaLavoro', crittografa(lista));
    mostraElenco(lista);
    document.getElementById('statoPagina').textContent = t.listaAggiornata + lista.length + t.elementi;
}

// ✅ CARICAMENTO INIZIALE
window.onload = function() {
    aggiornaInterfacciaLingua();
    const salvata = localStorage.getItem('listaLavoro');
    if (salvata) {
        const lista = decrittografa(salvata);
        if (!lista) return;
        const t = traduzioni[getLingua()];
        document.getElementById('statoPagina').textContent = t.listaCaricata + lista.length + t.elementi;
        mostraElenco(lista);
    }
};
</script>
</body>
