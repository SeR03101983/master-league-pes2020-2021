// ✅ PASSWORD MASTER E FUNZIONI DI CRITTOGRAFIA
const PASSWORD_MASTER = "LaTuaPasswordSegreta123";

function crittografa(dati) {
    return CryptoJS.AES.encrypt(JSON.stringify(dati), PASSWORD_MASTER).toString();
}

function decrittografa(stringaCritta) {
    if (!stringaCritta || typeof stringaCritta !== 'string' || stringaCritta.trim() === '') {
        return null;
    }
    try {
        const bytes = CryptoJS.AES.decrypt(stringaCritta, PASSWORD_MASTER);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    } catch {
        console.warn("Dati non validi o corrotti");
        return null;
    }
}

// ✅ GESTIONE LINGUA CENTRALIZZATA
function getLingua() { return localStorage.getItem('linguaScelta') || 'it'; }
function setLingua(l) { localStorage.setItem('linguaScelta', l); }

function aggiornaInterfacciaLingua() {
    const l = getLingua();
    const t = traduzioni[l];
    document.documentElement.lang = l;
    document.getElementById('bandieraAttuale').textContent = l === 'it' ? '🇮🇹' : l === 'en' ? '🇬🇧' : l === 'pt' ? '🇧🇷' : '🇪🇸';

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const chiave = el.getAttribute('data-i18n');
        if (t[chiave]) el.textContent = t[chiave];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const chiave = el.getAttribute('data-i18n-placeholder');
        if (t[chiave]) el.placeholder = t[chiave];
    });
}

function toggleMenuLingue() { document.getElementById('menuLingue').classList.toggle('visibile'); }

function cambiaLingua(nuovaLingua) {
    setLingua(nuovaLingua);
    aggiornaInterfacciaLingua();
    toggleMenuLingue();
}

// ✅ CHIUDE MENU CLICCANDO FUORI
document.addEventListener('click', e => {
    if (!e.target.closest('.contenitore-lingua')) document.getElementById('menuLingue').classList.remove('visibile');
});

// ✅ FUNZIONI DATI SQUADRA
function salvaDatiSquadra() {
    const dati = {
        nome: document.getElementById('nomeSquadra').value.trim(),
        ranking: document.getElementById('rankingSquadra').value.trim(),
        forza: parseFloat(document.getElementById('forzaSquadra').value) || 3,
        budget: parseInt(document.getElementById('budgetSquadra').value) || 0,
        obiettivo: document.getElementById('obiettivoSquadra').value.trim(),
        allenatoreAttuale: "Nessuno",
        ultimoAgg: new Date().toLocaleString()
    };
    localStorage.setItem('datiSquadra', crittografa(dati));
    const l = getLingua();
    alert(l === 'it' ? '✅ Dati Squadra Salvati!' : l === 'en' ? '✅ Team Data Saved!' : l === 'pt' ? '✅ Dados Salvos!' : '✅ ¡Datos Guardados!');
}

window.onload = function() {
    aggiornaInterfacciaLingua(); // ✅ TRADUCE SUBITO ALL'APERTURA
    const salvati = localStorage.getItem('datiSquadra');
    if (salvati) {
        const d = decrittografa(salvati);
        if(d) {
            document.getElementById('nomeSquadra').value = d.nome || '';
            document.getElementById('rankingSquadra').value = d.ranking || '';
            document.getElementById('forzaSquadra').value = d.forza || 3;
            document.getElementById('budgetSquadra').value = d.budget || 0;
            document.getElementById('obiettivoSquadra').value = d.obiettivo || '';
        }
    }
};
