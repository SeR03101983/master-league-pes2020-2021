// ✅ PASSWORD E FUNZIONI CRITTOGRAFIA (UGUALI ALLE ALTRE PAGINE)
const PASSWORD_MASTER = "LaTuaPasswordSegreta123";

function crittografa(dati) {
    return CryptoJS.AES.encrypt(JSON.stringify(dati), PASSWORD_MASTER).toString();
}

function decrittografa(stringaCritta) {
    if (!stringaCritta || typeof stringaCritta !== 'string' || stringaCritta.trim() === '') {
        return null;
    }
    try {
        const bytes = CryptoJS.AES.decrypt(stringaCritta, PASSWORD_MASTER);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    } catch {
        console.warn("Dati non validi o corrotti");
        return null;
    }
}

// ✅ GESTIONE LINGUA
function getLingua() { return localStorage.getItem('linguaScelta') || 'it'; }
function setLingua(l) { localStorage.setItem('linguaScelta', l); }

function aggiornaInterfacciaLingua() {
    const l = getLingua();
    const t = traduzioni[l];
    document.documentElement.lang = l;
    document.getElementById('bandieraAttuale').textContent = l === 'it' ? '🇮🇹' : l === 'en' ? '🇬🇧' : l === 'pt' ? '🇧🇷' : '🇪🇸';

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const chiave = el.getAttribute('data-i18n');
        if (t[chiave]) el.textContent = t[chiave];
    });
}

function toggleMenuLingue() { document.getElementById('menuLingue').classList.toggle('visibile'); }
function cambiaLingua(nuovaLingua) { setLingua(nuovaLingua); aggiornaInterfacciaLingua(); toggleMenuLingue(); caricaStorico(); }
document.addEventListener('click', e => { if (!e.target.closest('.contenitore-lingua')) document.getElementById('menuLingue').classList.remove('visibile'); });

function ottieniAnnoStagione(num) {
    const inizio = 2019 + (num - 1);
    return `${inizio}/${String(inizio + 1).slice(-2)}`;
}

// ✅ FUNZIONE PRINCIPALE: LETTURA E VISUALIZZAZIONE CONTEGGI PRECISI
function caricaStorico() {
    const t = traduzioni[getLingua()];
    const contenitore = document.getElementById('elencoStorico');
    const vuoto = document.getElementById('vuotoMessaggio');
    
    const datiCritti = localStorage.getItem('storicoCarriera');
    let storico = [];
    try {
        storico = datiCritti ? decrittografa(datiCritti) : [];
        if (!Array.isArray(storico)) storico = [];
    } catch { storico = [] }

    if (storico.length === 0) {
        contenitore.innerHTML = '';
        vuoto.style.display = 'block';
        return;
    }
    vuoto.style.display = 'none';

    storico.sort((a, b) => (b.numStagione || 0) - (a.numStagione || 0));

    contenitore.innerHTML = '';
    storico.forEach((rec, idx) => {
        // Valori base
        const iniziali = rec.iniziali || {ambiente: '-', dirigenza: '-', progetto: '-'};
        const finali = rec.finali || {ambiente: '-', dirigenza: '-', progetto: '-'};
        const numStagione = rec.numStagione || idx + 1;
        const anno = rec.anno || ottieniAnnoStagione(numStagione);
        const nome = rec.nomeAllenatore || 'N/D';
        const esonerato = !!rec.esonerato;
        const campionato = !!rec.campionato;

        // ✅ CONTEGGIO PRECISO COPPE: numero volte che è stato cliccato il pulsante
        const coppeNaz = rec.coppeNazionali || 0;
        const coppeInt = rec.coppeInternazionali || 0;

        // ✅ OBIETTIVO: mostra esattamente Raggiunto / Non Raggiunto
        const obiettivo = rec.obiettivoRaggiunto === true ? t.raggiunto : 
                         rec.obiettivoRaggiunto === false ? t.nonRaggiunto : t.nessunDato;

        contenitore.innerHTML += `
        <div class="riga-stagione">
            <div class="testata">
                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <span class="badge-stagione">${t.stagione} ${numStagione} - ${anno}</span>
                    <span class="badge-allenatore">${t.allenatore}: ${nome}</span>
                    ${esonerato ? `<span class="badge-esonerato">${t.esonerato}</span>` : ''}
                </div>
                <button class="btn-giallo" onclick="cancellaRiga(${idx})">${t.elimina}</button>
            </div>

            <div class="griglia-dati">
                <div class="blocco">
                    <h4>${t.parametriIniziali}</h4>
                    <div class="parametri">
                        <div class="param"><div class="titolo">${t.ambiente}</div><div class="val">${iniziali.ambiente}</div></div>
                        <div class="param"><div class="titolo">${t.dirigenza}</div><div class="val">${iniziali.dirigenza}</div></div>
                        <div class="param"><div class="titolo">${t.progetto}</div><div class="val">${iniziali.progetto}</div></div>
                    </div>
                </div>

                <div class="blocco">
                    <h4>${t.parametriFinali}</h4>
                    <div class="parametri">
                        <div class="param"><div class="titolo">${t.ambiente}</div><div class="val">${finali.ambiente}</div></div>
                        <div class="param"><div class="titolo">${t.dirigenza}</div><div class="val">${finali.dirigenza}</div></div>
                        <div class="param"><div class="titolo">${t.progetto}</div><div class="val">${finali.progetto}</div></div>
                    </div>
                </div>

                <div class="blocco">
                    <h4>${t.risultatiTrofei}</h4>
                    <div class="titolo">${t.campionato}: <span class="val">${campionato ? t.vinto : t.nessuno}</span></div>
                    <div class="titolo">${t.coppeNazionali}: <span class="val">${coppeNaz}</span></div>
                    <div class="titolo">${t.coppeInternazionali}: <span class="val">${coppeInt}</span></div>
                    <div class="titolo">${t.obiettivo}: <span class="val">${obiettivo}</span></div>
                </div>
            </div>
        </div>`;
    });
}

function cancellaRiga(indice) {
    const t = traduzioni[getLingua()];
    if (!confirm(t.confermaCancellaRiga)) return;
    const datiCritti = localStorage.getItem('storicoCarriera');
    let storico = datiCritti ? decrittografa(datiCritti) : [];
    if (!Array.isArray(storico)) storico = [];
    storico.splice(indice, 1);
    localStorage.setItem('storicoCarriera', crittografa(storico));
    caricaStorico();
}

function cancellaTutto() {
    const t = traduzioni[getLingua()];
    if (!confirm(t.confermaCancellaTutto)) return;
    localStorage.removeItem('storicoCarriera');
    caricaStorico();
}

window.onload = function() {
    aggiornaInterfacciaLingua();
    caricaStorico();
};
</script>
